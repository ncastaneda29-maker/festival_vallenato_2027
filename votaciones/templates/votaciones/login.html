{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Festival Vallenato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #040405; 
            color: #ffffff; 
            font-family: sans-serif; 
        }
        .card-auth { 
            background-color: #1a1a1e; 
            border: 1px solid #16b24a; 
            border-radius: 10px; 
            color: #ffffff; 
        }
        /* Forzar etiquetas y campos de entrada legibles para el formulario de Django */
        .card-auth p label {
            color: #ffffff !important;
            font-weight: 500;
        }
        .card-auth input {
            background-color: #2b2b30 !important;
            border: 1px solid #444 !important;
            color: #ffffff !important;
            border-radius: 5px;
            padding: 6px 12px;
            width: 100%;
        }
        .card-auth input:focus {
            background-color: #2b2b30 !important;
            color: #ffffff !important;
            border-color: #16b24a !important;
            box-shadow: 0 0 0 0.25rem rgba(22, 178, 74, 0.25);
            outline: none;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card card-auth p-4 shadow" style="width: 380px;">
        <h3 class="text-center text-success mb-3">Iniciar Sesión</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-success w-100 mt-2 fw-bold">Entrar</button>
        </form>
        <div class="text-center mt-3">
            <small class="text-light">¿No tienes cuenta? <a href="{% url 'registro_votante' %}" class="text-success text-decoration-none fw-bold">Regístrate aquí</a></small>
        </div>
        <div class="text-center mt-2">
            <a href="{% url 'lista_votaciones' %}" class="text-decoration-none text-muted small">← Volver al inicio</a>
        </div>
    </div>
</body>
</html>
