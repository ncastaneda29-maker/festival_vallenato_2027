{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Participante - Festival Vallenato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light py-5">
    <div class="container" style="max-width: 600px;">
        <div class="card bg-black border-success shadow-lg p-4">
            <h3 class="text-success mb-3">Editar Participante: {{ participante.nombre }}</h3>
            
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-success fw-bold">Guardar Cambios</button>
                    <a href="{% url 'crear_edicion' %}" class="btn btn-outline-light btn-sm">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
